name: CI/CD

on:
  push:
    branches: [main, develop, cursor/entrega-devops]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: acrecocompliance.azurecr.io
  IMAGE: ecocompliance-api
  RESOURCE_GROUP: rg-ecocompliance

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar o pacote
        run: mvn -B -DskipTests package

  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Executar a suíte
        run: mvn -B test

  imagem:
    name: Imagem
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/entrega-devops')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Publicar a imagem no ACR
        run: |
          az acr build \
            --registry acrecocompliance \
            --image "${IMAGE}:${{ github.sha }}" \
            --image "${IMAGE}:latest" \
            .

  deploy-staging:
    name: Deploy staging
    needs: imagem
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Atualizar o App Service de staging
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name ecocompliance-staging \
            --container-image-name "${REGISTRY}/${IMAGE}:${{ needs.imagem.outputs.tag }}" \
            --container-registry-url "https://${REGISTRY}" \
            -o none
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name ecocompliance-staging \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}' \
            -o none
          az webapp restart --resource-group "$RESOURCE_GROUP" --name ecocompliance-staging

  deploy-production:
    name: Deploy produção
    needs: imagem
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Atualizar o App Service de produção
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name ecocompliance-production \
            --container-image-name "${REGISTRY}/${IMAGE}:${{ needs.imagem.outputs.tag }}" \
            --container-registry-url "https://${REGISTRY}" \
            -o none
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name ecocompliance-production \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}' \
            -o none
          az webapp restart --resource-group "$RESOURCE_GROUP" --name ecocompliance-production
