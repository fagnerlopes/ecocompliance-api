name: Testes automatizados BDD

on:
  workflow_dispatch:
  push:
    paths:
      - "testes-automatizados/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".github/workflows/testes-automatizados.yml"

jobs:
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Subir a API
        run: docker compose up -d --build

      - name: Aguardar /up
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/up; then
              exit 0
            fi
            sleep 10
          done
          docker compose logs --tail 80
          exit 1

      - name: Executar Cucumber
        run: mvn -f testes-automatizados/pom.xml clean test

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: testes-automatizados/target/cucumber-reports.html

      - name: Derrubar o Compose
        if: always()
        run: docker compose down
